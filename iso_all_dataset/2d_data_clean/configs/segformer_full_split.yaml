# SegFormer + full_split (9 ch with pr split)
# Note: ImageNet pretrained is RGB (3 ch); after switching to 9 ch, patch_embeddings are re-randomly initialized
model_name:   segformer_full_split
model_class:  iso_unet.baseline_segformer.SegFormerBaseline
dataset_kind: single_frame
input_set:    full_split
seq_len:      12
batch_size:   16
lr:           1.0e-4               # ⚠️ pretrained, low lr
max_epochs:   1000
patience:     10
max_batch:    3000
gradient_clip_val: 1.0

model_kwargs:
  num_labels:  1
  pretrained:  'nvidia/mit-b0'
