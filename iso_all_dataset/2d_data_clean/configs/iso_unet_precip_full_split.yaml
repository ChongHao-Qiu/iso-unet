# Regional UNet + full_split + precip routing
# 9 ch input + wet/dry expert routing (pr = precl + precc auto-summed by train.py)
# Integrates all features: split precipitation as input + use total pr as routing mask
model_name:   iso_unet_precip_full_split
model_class:  iso_unet.baseline_iso_unet.IsoUNetBaseline
dataset_kind: sequence
input_set:    full_split
seq_len:      12
batch_size:   4                  # more params after adding wet/dry expert — watch GPU memory
lr:           1.0e-3
max_epochs:   1000
patience:     10
max_batch:    3000
gradient_clip_val: 1.0

model_kwargs:
  landfrac_idx:           7      # train.py auto-detect
  base_channels:          64
  d_state:                64
  H:                      90
  W:                      180
  stem_k:                 4
  use_disentangled_stem:  true
  use_temporal_context:   true
  use_bottleneck_moe:     true
  use_skip_attn:          true
  skip_attn_levels:       [3, 4]
  # ── Precip routing on ──
  use_precip_routing:     true
  # pr_channels:          [1, 2]   # train.py auto-detects (precl+precc summed)
  # ── Prompt loss ──
  lambda_prompt:          0.1
  lambda_prompt_final:    0.0
  lambda_decay_epochs:    50
  prompt_tau:             0.5
