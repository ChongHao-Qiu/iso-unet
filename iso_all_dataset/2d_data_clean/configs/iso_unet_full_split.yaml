# Regional UNet + full_split — 9 ch, LANDFRAC at idx=7 (train.py auto-detects)
# Note: this version **has no precip routing** (use_precip_routing=False), only splits pr as input.
# To add wet/dry expert → use iso_unet_precip_full_split.yaml
model_name:   iso_unet_full_split
model_class:  iso_unet.baseline_iso_unet.IsoUNetBaseline
dataset_kind: sequence
input_set:    full_split          # 9 ch: [tas, precl, precc, PS, TMQ, QFLX, FLUT, LANDFRAC, aice]
seq_len:      12
batch_size:   4
lr:           1.0e-3
max_epochs:   1000
patience:     10
max_batch:    3000
gradient_clip_val: 1.0

model_kwargs:
  landfrac_idx:           7      # ★ in full_split, LANDFRAC is at idx 7 (train.py also auto-fixes)
  base_channels:          64
  d_state:                64
  H:                      90
  W:                      180
  stem_k:                 4
  use_disentangled_stem:  true
  use_temporal_context:   true
  use_bottleneck_moe:     true
  use_skip_attn:          true
  skip_attn_levels:       [3, 4]
  # Precip routing: off (pr is already split as input, no wet/dry expert routing)
  use_precip_routing:     false
  # Prompt loss
  lambda_prompt:          0.1
  lambda_prompt_final:    0.0
  lambda_decay_epochs:    50
  prompt_tau:             0.5
