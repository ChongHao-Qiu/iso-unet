# ══════════════════════════════════════════════════════════════════════════
#  Leave-one-out ablation L4: - SkipConnection (region-expert skip attention)
#
#  Identical to configs/iso_unet_4way_ice_full_split.yaml (the Full model)
#  except for the single flag marked ★ below. Everything else — base_channels,
#  d_state, batch_size, lr and the training schedule — is unchanged, so any
#  difference in RMSE is attributable to the removed component.
#
#  Run-level settings (data split, ood_preset, normalization, lat weighting) are
#  left to the CLI / train.py defaults, exactly as in the other configs.
#
#  Removes the region-expert attention applied to the four encoder->decoder skip
#  connections; skips are passed through unmodulated as in a standard U-Net.
# ══════════════════════════════════════════════════════════════════════════
model_name:   loo_L4_no_skip_attn
model_class:  iso_unet.baseline_iso_unet.IsoUNetBaseline
dataset_kind: sequence
input_set:    full_split          # 9 ch: [tas, precl, precc, PS, TMQ, QFLX, FLUT, LANDFRAC, aice]
seq_len:      12
batch_size:   4
lr:           1.0e-3
max_epochs:   1000
patience:     10
max_batch:    3000
gradient_clip_val: 1.0

model_kwargs:
  landfrac_idx:           7
  base_channels:          64
  d_state:                64
  H:                      90
  W:                      180
  stem_k:                 4
  use_disentangled_stem:  true
  use_temporal_context:   true
  use_bottleneck_moe:     true
  use_skip_attn:          false   # ★ ABLATED
  skip_attn_levels:       [1, 2, 3, 4]
  # ── 4-way product routing ──
  use_precip_routing:     true
  pr_channels:            [1, 2]   # precl, precc
  moe_mode:               product4
  # ── Sea-ice expert ──
  use_ice_routing:        true
  ice_idx:                8       # aice channel
  # ── Prompt-alignment loss ──
  lambda_prompt:          0.1
  lambda_prompt_final:    0.0
  lambda_decay_epochs:    50
  prompt_tau:             0.5
