# ClimaX (Microsoft 2023) — SINGLE-DAY input / single-day output variant.
# Same ViT backbone as climax_full_split.yaml, but uses ClimaXSingleDayBaseline:
# the time-aggregation cross-attention is removed and each sample is one frame
# in → one frame out:   x:(B,C,H,W) → y_hat:(B,1,H,W).
#
# dataset_kind: single_frame  → SingleFrameDataset yields (C,H,W) per sample,
#   matching the other single-frame baselines (unet2d_vanilla, segformer, ...).
# No seq_len needed by the model; seq_len below only sets the test-eval offset
# (skip first seq_len-1 frames) so eval frames align with the 12-day setups.
#
# Trained FROM SCRATCH (no pretrained ERA5/CMIP6 weights).
model_name:   climax_single_day_full_split
model_class:  iso_unet.baseline_climax.ClimaXSingleDayBaseline
dataset_kind: single_frame
input_set:    full_split          # 9 ch (tas, precl, precc, PS, TMQ, QFLX, FLUT, LANDFRAC, aice)
seq_len:      12                  # eval-offset only (single_frame dataset uses 1-frame samples)
batch_size:   16                  # only 1 frame/sample → bigger batch than the 12-day config
lr:           3.0e-4
max_epochs:   1000
patience:     10
max_batch:    3000
gradient_clip_val: 1.0

model_kwargs:
  out_channels:         1
  H:                    90
  W:                    180
  patch_size:           5         # 90/5=18, 180/5=36 → 648 patches/var/frame
  embed_dim:            256
  depth:                4         # ViT block count
  decoder_depth:        2
  num_heads:            8
  mlp_ratio:            4.0
  drop_path:            0.1
  drop_rate:            0.1
